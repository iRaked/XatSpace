    <!-- REPRODUCTOR PINK -->
<style element="glenplayer01">
  :root {
    /* 🌸 Posicionamiento */
    --MusicPlayer-Distance-From-Bottom: 30px;

    /* 🎀 Marco del reproductor */
    --MusicPlayer-Frame-Thickness: 12px;
    --MusicPlayer-Frame-Color: #C71585; /* Deep pink brillante */
    --MusicPlayer-Frame-Transparency: 65%;

    /* 🩰 Fondo del texto */
    --MusicPlayer-Text-Background: #ffe4f2; /* Rosa claro pastel */
    --MusicPlayer-Text-Padding: 12px;
    --MusicPlayer-Text-Align: center;

    /* 💬 Estilo del texto superior/inferior */
    --MusicPlayer-Text-TOP-Size: 11px;
    --MusicPlayer-Text-TOP-Color: #B40486;
    --MusicPlayer-Text-BOTTOM-Size: 11px;
    --MusicPlayer-Text-BOTTOM-Color: #B40486;

    /* 🍥 Círculo central (play/pausa) */
    --MusicPlayer-Circle-Size: 60px;
    --MusicPlayer-Circle-Background: radial-gradient(circle, #f8c8dc, #f5a9d0);

    /* ▶️ Botón de reproducción */
    --MusicPlayer-PlayButton-Size: 12px;
    --MusicPlayer-PlayButton-Color: white;

    /* 📶 Barra de audio */
    --MusicPlayer-Bar-Thickness: 2px;
    --MusicPlayer-Bar-Spacing: 2px;
    --MusicPlayer-Bar-Color: #DF01D7; /* Rosa eléctrico */

    /* 🎬 Animaciones */
    --MusicPlayer-SlideIn-Speed: 0.69s;
    --MusicPlayer-SlideOut-Speed: 1s;
  }
</style>
